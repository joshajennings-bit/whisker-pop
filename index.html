<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Whisker Pop">
<meta name="theme-color" content="#2b2370">
<title>Whisker Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-height phone-style stage; screens stack and cross-fade; board is the focus. */
:root{
 --ink:#2a1f4d; --ink2:#5b4b8a; --bg1:#2b2370; --bg2:#7a4fb5; --bg3:#ff9d76;
 --cream:#fff6e8; --card:#fffaf2; --coral:#ff6b57; --gold:#ffc83d; --mint:#43cfa5; --sky:#5ab4ff; --pink:#ff8fb1;
 --shadow:0 6px 0 rgba(40,20,80,.25),0 12px 24px rgba(20,10,60,.35);
 --f-d:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif; --f-b:'Nunito',ui-rounded,system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#2b2370;color:var(--ink);font-family:var(--f-b);font-weight:600}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden}
.bgdeco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bgdeco i{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(18px,-26px) scale(1.08)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .3s}
.screen.on{display:flex}.screen.vis{opacity:1}
.btn{font-family:var(--f-d);font-weight:800;font-size:22px;padding:10px 26px 12px;border-radius:20px;color:#fff;background:linear-gradient(#ff8a6b,var(--coral));box-shadow:0 5px 0 #c9402f,0 10px 18px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9402f}
.btn.green{background:linear-gradient(#5fe0ba,var(--mint));box-shadow:0 5px 0 #1f9a78,0 10px 18px rgba(0,0,0,.3)}
.btn.green:active{box-shadow:0 1px 0 #1f9a78}
.btn.blue{background:linear-gradient(#7cc6ff,var(--sky));box-shadow:0 5px 0 #2f7fcf,0 10px 18px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);color:#fff;font-size:18px}
.btn.sm{font-size:17px;padding:7px 16px 9px;border-radius:15px}
.btn[disabled]{filter:grayscale(.8) brightness(.9);pointer-events:none}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,10,60,.45);border-radius:999px;padding:4px 12px 4px 6px;color:#fff;font-family:var(--f-d);font-weight:800;font-size:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.pill svg{width:26px;height:26px;flex:none}
.pill small{font-size:12px;opacity:.8;font-weight:700}
.ibtn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:rgba(20,10,60,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);color:#fff;transition:transform .12s}
.ibtn:active{transform:scale(.92)}.ibtn svg{width:26px;height:26px}
/* title */
#title{align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#title h1{font-family:var(--f-d);font-weight:800;font-size:clamp(52px,16vw,84px);line-height:.9;margin:0;color:#fff;text-shadow:0 5px 0 #4a2d8e,0 10px 24px rgba(0,0,0,.35);letter-spacing:1px}
#title h1 span{color:var(--gold)}
#title p{margin:0 0 14px;color:#ffe9d6;font-size:18px}
.heroCats{display:flex;justify-content:center;margin:10px 0 6px}
.heroCats svg{width:23vw;max-width:116px;margin:0 -6px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3));animation:bob 2.4s ease-in-out infinite}
.heroCats svg:nth-child(2n){animation-delay:-.8s;transform:translateY(10px)}
.heroCats svg:nth-child(3n){animation-delay:-1.5s}
@keyframes bob{50%{translate:0 -10px}}
/* map */
#map{padding:0}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;position:relative;z-index:3;flex-wrap:wrap}
.topbar .sp{flex:1}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--cream);border:3px solid var(--gold);overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.avatar svg{width:100%;height:100%}
.mapscroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mapscroll::-webkit-scrollbar{display:none}
.mapinner{position:relative;width:100%;}
.mapinner svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:26px;color:#fff;background:linear-gradient(#ff8a6b,var(--coral));box-shadow:0 5px 0 #c9402f,0 0 0 4px #fff6e8;transition:transform .15s}
.node:active{transform:scale(.93)}
.node.done{background:linear-gradient(#5fe0ba,var(--mint));box-shadow:0 5px 0 #1f9a78,0 0 0 4px #fff6e8}
.node.lock{background:#8d86ad;box-shadow:0 5px 0 #5f5882,0 0 0 4px #d9d3ee;color:#e8e4f7;pointer-events:none}
.node.cur{animation:pulse 1.3s ease-in-out infinite}
.node.chal{background:linear-gradient(#b48cff,#7d4de0);box-shadow:0 5px 0 #4f2aa8,0 0 0 4px var(--gold)}
.node.chal.done{background:linear-gradient(#ffd96b,#f0a81c);box-shadow:0 5px 0 #b97a08,0 0 0 4px #fff6e8}
@keyframes pulse{50%{transform:scale(1.12)}}
.node .st{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);display:flex;gap:1px;pointer-events:none}
.node .st svg{width:18px;height:18px}
.node .crown{position:absolute;top:-20px;width:28px;height:22px}
.milestone{position:absolute;left:50%;transform:translateX(-50%);background:var(--card);padding:4px 12px;border-radius:12px;font-family:var(--f-d);font-weight:800;font-size:14px;color:var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap}
.mapcat{position:absolute;width:56px;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.nav{display:flex;justify-content:space-around;padding:8px 10px 10px;gap:6px;background:linear-gradient(transparent,rgba(20,10,60,.55));position:relative;z-index:3}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-family:var(--f-d);font-weight:700;font-size:14px;padding:6px 0;border-radius:16px;background:rgba(255,255,255,.12);position:relative;transition:transform .12s}
.nav button:active{transform:scale(.94)}
.nav svg{width:30px;height:30px}
.dot{position:absolute;top:2px;right:18%;width:14px;height:14px;border-radius:50%;background:var(--coral);border:2px solid #fff;animation:pulse 1s infinite}
/* game screen */
#game{padding:0}
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;color:#fff}
.hud .lvl{font-family:var(--f-d);font-weight:800;font-size:20px;flex:1;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.hud .lvl small{display:block;font-size:12px;opacity:.8;font-weight:700}
.movesbox{background:var(--cream);color:var(--ink);border-radius:16px;padding:2px 14px 4px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);min-width:84px}
.movesbox b{display:block;font-family:var(--f-d);font-size:32px;line-height:1}
.movesbox small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:800}
.movesbox.low b{color:var(--coral);animation:pulse .7s infinite}
.scorebar{margin:0 12px;display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--f-d);font-weight:800}
.scorebar .sc{font-size:22px;min-width:76px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:14px;border-radius:99px;background:rgba(20,10,60,.5);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .4s}
.bar u{position:absolute;top:-6px;width:22px;height:22px;margin-left:-11px;text-decoration:none;filter:grayscale(1) brightness(.8);transition:.3s}
.bar u.on{filter:none;transform:scale(1.2)}
.bar u svg{width:100%;height:100%}
.goals{display:flex;gap:8px;justify-content:center;padding:8px 10px;flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:6px;background:rgba(255,250,242,.94);border-radius:14px;padding:3px 12px 3px 4px;font-family:var(--f-d);font-weight:800;font-size:19px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.goal svg{width:32px;height:32px}
.goal.ok{background:#c9f7e5}.goal.ok b::after{content:' \2713';color:#1f9a78}
.goal.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
.boardwrap{flex:1;display:grid;place-items:center;min-height:0;padding:4px 8px}
#board{position:relative;border-radius:22px;background:linear-gradient(#fff3dc,#ffe2c6);padding:0;box-shadow:0 8px 0 rgba(60,30,100,.35),0 18px 30px rgba(10,5,40,.45),inset 0 0 0 4px rgba(255,255,255,.7);touch-action:none;overflow:hidden}
#cellsbg,#cells,#pieces,#fx{position:absolute;inset:0}#cells{pointer-events:none;z-index:2}
#fx{pointer-events:none;z-index:5;overflow:visible}
#board{overflow:visible}
.cell{position:absolute;width:var(--s);height:var(--s);padding:2px}
.cell i{display:block;width:100%;height:100%;border-radius:12px;background:rgba(190,130,90,.16);position:relative;overflow:hidden}
.cell.alt i{background:rgba(190,130,90,.28)}
.cell .fl{position:absolute;inset:0}.cell.f-paw i{background:rgba(255,120,170,.2);box-shadow:inset 0 0 0 3px rgba(255,110,165,.7)}.cell.f-yarn i{background:rgba(60,200,170,.16);box-shadow:inset 0 0 0 3px rgba(50,190,160,.75)}.cell.f-yarn.h2 i{background:rgba(70,150,245,.2);box-shadow:inset 0 0 0 3px rgba(60,140,240,.85)}.cell.gone i{animation:gone .35s forwards}@keyframes gone{to{opacity:0;transform:scale(1.3)}}
.cell .fl svg{width:100%;height:100%}
.pc{position:absolute;left:0;top:0;width:var(--s);height:var(--s);padding:calc(var(--s)*.05);transition:transform .18s ease;will-change:transform;pointer-events:none}
.pc .in{width:100%;height:100%;transition:transform .15s,filter .2s}
.pc svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 2px rgba(60,20,20,.35))}
.pc.sel .in{transform:scale(1.14);filter:brightness(1.12)}
.pc.pop{animation:pop .3s ease-in forwards}
@keyframes pop{30%{transform:translate(var(--tx),var(--ty)) scale(1.25)}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.pc.hint .in{animation:hint .7s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.18) rotate(-6deg)}}
.pc.sp-bomb .in{animation:glowB 1s ease-in-out infinite alternate}
.pc.sp-laser .in,.pc.sp-laserv .in{animation:glowL 1s ease-in-out infinite alternate}
.pc.sp-zoom .in{animation:wig .35s ease-in-out infinite alternate}
.pc.sp-rainbow .in{animation:spin 2.2s linear infinite}
@keyframes glowB{to{filter:drop-shadow(0 0 7px #ff6b2c) brightness(1.15);transform:scale(1.06)}}
@keyframes glowL{to{filter:drop-shadow(0 0 8px #3de0ff) brightness(1.15);transform:scale(1.06)}}
@keyframes wig{from{transform:rotate(-9deg)}to{transform:rotate(9deg) scale(1.05)}}
@keyframes spin{to{filter:hue-rotate(360deg) drop-shadow(0 0 8px #fff)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.pc:nth-child(3n) .eyes{animation-delay:-1.3s}.pc:nth-child(4n) .eyes{animation-delay:-2.7s}.pc:nth-child(5n) .eyes{animation-delay:-3.5s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fxp{position:absolute;pointer-events:none;will-change:transform,opacity}
.beam{position:absolute;pointer-events:none;border-radius:99px;background:linear-gradient(90deg,transparent,#fff,#6ff0ff,#fff,transparent);box-shadow:0 0 18px 6px rgba(80,230,255,.8)}
.float{position:absolute;font-family:var(--f-d);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(60,20,100,.6),0 0 10px rgba(255,200,60,.8);pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%)}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--f-d);font-weight:800;font-size:clamp(34px,11vw,56px);color:#fff;text-shadow:0 5px 0 #7d3ae0,0 10px 20px rgba(0,0,0,.4);z-index:9;pointer-events:none;white-space:nowrap}
.boosters{display:flex;justify-content:center;gap:10px;padding:6px 10px 12px}
.bst{width:70px;padding:6px 0 4px;border-radius:18px;background:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;position:relative;font-family:var(--f-d);font-weight:800;font-size:12px;color:var(--ink);transition:transform .12s}
.bst:active{transform:scale(.94)}
.bst.armed{background:var(--gold);transform:translateY(-6px)}
.bst svg{width:34px;height:34px}
.bst .cnt{position:absolute;top:-7px;right:-5px;min-width:24px;height:24px;border-radius:12px;background:var(--coral);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.bst .cnt.buy{background:var(--gold);color:var(--ink)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:10px 18px;border-radius:16px;font-family:var(--f-d);font-weight:800;z-index:60;box-shadow:var(--shadow);animation:toast 2.2s forwards;white-space:nowrap;max-width:92%}
@keyframes toast{0%{opacity:0;translate:0 14px}10%,85%{opacity:1;translate:0 0}100%{opacity:0}}
/* modals */
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(15,8,45,.6);padding:14px;backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:28px;width:100%;max-width:440px;max-height:92%;overflow:auto;padding:18px 18px 20px;box-shadow:0 8px 0 #cdbfa8,0 24px 50px rgba(0,0,0,.5);text-align:center;position:relative;animation:pop2 .35s cubic-bezier(.2,1.4,.4,1);scrollbar-width:thin}
@keyframes pop2{from{transform:scale(.7);opacity:0}}
.sheet h2{font-family:var(--f-d);font-weight:800;font-size:30px;margin:0 0 4px;color:var(--ink);line-height:1.1}
.sheet h3{font-family:var(--f-d);margin:12px 0 6px;font-size:18px;color:var(--ink2)}
.sheet p{margin:4px 0 12px;color:var(--ink2)}
.sheet .btn.ghost{background:#f4ead8;color:var(--ink2);box-shadow:inset 0 0 0 2px #d8cbb3;text-shadow:none}
.sheet .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:#efe4d2;display:grid;place-items:center;color:var(--ink2);font-size:20px;font-family:var(--f-d);font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 8px}
.stars svg{width:70px;height:70px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.stars svg:nth-child(2){transform:translateY(-12px) scale(1.15)}
.stars .pop{animation:starin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starin{from{transform:scale(0) rotate(-120deg);opacity:0}}
.bigcat{width:120px;margin:0 auto;display:block;animation:bob 1.6s ease-in-out infinite}
.stat{display:flex;justify-content:space-between;padding:8px 14px;background:#f4ead8;border-radius:12px;margin:6px 0;font-family:var(--f-d);font-weight:700;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.gcat{background:#f4ead8;border-radius:18px;padding:8px 4px 6px;position:relative;color:var(--ink);font-size:13px;line-height:1.15}
.gcat svg{width:70%;display:block;margin:0 auto 2px}
.gcat b{font-family:var(--f-d);font-size:16px;display:block}
.gcat.locked svg{filter:brightness(0) opacity(.25)}
.gcat small{display:block;color:var(--ink2);font-size:11px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.day{background:#f4ead8;border-radius:16px;padding:6px 2px;font-family:var(--f-d);font-weight:800;font-size:13px;color:var(--ink);position:relative}
.day.today{background:var(--gold);transform:scale(1.06);box-shadow:0 3px 0 #c99a10}
.day.got{opacity:.5}.day.got::after{content:'\2713';position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#1f9a78}
.day.d7{grid-column:span 2}
.day svg{width:34px;height:34px;display:block;margin:2px auto}
.shopitem{display:flex;align-items:center;gap:12px;background:#f4ead8;border-radius:16px;padding:8px 12px;margin:8px 0;text-align:left;color:var(--ink)}
.shopitem svg{width:44px;height:44px;flex:none}
.shopitem div{flex:1;font-size:13px;line-height:1.2}.shopitem b{font-family:var(--f-d);font-size:17px;display:block}
.sl{display:flex;align-items:center;gap:12px;margin:12px 0;text-align:left;font-family:var(--f-d);font-weight:700;color:var(--ink)}
.sl span{flex:1}
input[type=range]{width:55%;accent-color:var(--coral)}
.tog{width:56px;height:32px;border-radius:99px;background:#cfc3ac;position:relative;transition:.2s;flex:none}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tog.on{background:var(--mint)}.tog.on::after{left:27px}
input[type=text]{font:inherit;font-family:var(--f-d);font-weight:800;font-size:22px;text-align:center;border:3px solid #e2d4bb;border-radius:14px;padding:6px 10px;width:80%;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.avpick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.avpick button{width:52px;height:52px;border-radius:50%;background:#f4ead8;overflow:hidden;border:3px solid transparent}
.avpick button.on{border-color:var(--coral)}.avpick svg{width:100%;height:100%}
.tutor{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:var(--cream);padding:10px 16px;border-radius:18px;font-family:var(--f-d);font-weight:800;color:var(--ink);z-index:20;box-shadow:var(--shadow);max-width:90%;text-align:center;animation:pop2 .4s;pointer-events:none}
.pc.tough svg{filter:saturate(.7) brightness(.8) drop-shadow(0 3px 2px rgba(60,20,20,.35))}
.pc.item .in{animation:bob 1.6s ease-in-out infinite}
@media(max-height:640px){.goals{padding:4px}.boosters{padding-bottom:6px}.bst{width:60px}.hud{padding-top:4px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<style>:root{--sat:env(safe-area-inset-top,0px)}
html{background:linear-gradient(170deg,#2b2370,#7a4fb5 55%,#ff9d76) no-repeat fixed;height:100%}
html,body{margin:0;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:auto}
#app{position:absolute;inset:0;height:auto;max-width:none}
#app>.screen{padding-top:var(--sat)}
#app>.modal{padding-top:calc(14px + var(--sat))}
.ver{margin:6px 0 0!important;font-size:14px!important;opacity:.7;color:#fff;font-family:var(--f-d);font-weight:700}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{try{const p=document.createElement('div');p.style.cssText='position:fixed;top:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden';document.body.appendChild(p);
const px=parseFloat(getComputedStyle(p).paddingTop)||0;p.remove();
const sa=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
if(px<20&&sa)document.documentElement.style.setProperty('--sat','56px')}catch(e){}});</script>
</head><body>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
/* ---------- save ---------- */
const KEY='whiskerpop.v1';
const DEF=()=>({name:'Cat Friend',avatar:'orange',coins:150,lives:5,regenAt:0,stars:{},best:{},unlocked:1,
 boosters:{hammer:2,shuffle:1,moves:1,rainbow:1},daily:{last:'',streak:0},gallery:{orange:1,black:1,white:1,gray:1},
 stats:{cleared:0,score:0,mega:0,played:0,won:0},set:{music:true,sfx:true,mv:.5,sv:.8,haptic:true,voice:true},seen:{}});
let S=DEF(), memSave=null;
function load(){try{const j=localStorage.getItem(KEY);if(j){S=Object.assign(DEF(),JSON.parse(j));S.set=Object.assign(DEF().set,S.set);S.boosters=Object.assign(DEF().boosters,S.boosters)}}catch(e){if(memSave)S=memSave}}
function save(){memSave=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const MAXL=5, REGEN=20*60*1000;
function tickLives(){const n=Date.now();if(S.lives>=MAXL){S.regenAt=0;return}
 if(!S.regenAt)S.regenAt=n+REGEN;
 while(S.lives<MAXL&&n>=S.regenAt){S.lives++;S.regenAt+=REGEN}
 if(S.lives>=MAXL)S.regenAt=0}
function loseLife(){tickLives();if(S.lives>0){if(S.lives===MAXL)S.regenAt=Date.now()+REGEN;S.lives--}save()}
/* ---------- audio ---------- */
const A={ctx:null,master:null,sfx:null,mus:null,musicOn:false,step:0,timer:0};
function audioInit(){
 if(A.ctx)return; try{
 const C=window.AudioContext||window.webkitAudioContext; A.ctx=new C();
 A.master=A.ctx.createGain();A.master.connect(A.ctx.destination);
 A.sfx=A.ctx.createGain();A.sfx.connect(A.master);A.mus=A.ctx.createGain();A.mus.connect(A.master);
 const len=A.ctx.sampleRate;A.noise=A.ctx.createBuffer(1,len,A.ctx.sampleRate);const d=A.noise.getChannelData(0);let l=0;
 for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}
 applyAudio();startMusic();iosUnlock();loadVox()}catch(e){A.ctx=null}}
function iosUnlock(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{const z=A.ctx.createBufferSource();z.buffer=A.ctx.createBuffer(1,1,22050);z.connect(A.ctx.destination);z.start(0)}catch(e){}
 try{const n=844,u=new Uint8Array(n),dv=new DataView(u.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)u[o+i]=t.charCodeAt(i)};
  w(0,'RIFF');dv.setUint32(4,n-8,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,800,true);u.fill(128,44);
  let t='';u.forEach(x=>t+=String.fromCharCode(x));const a=new Audio('data:audio/wav;base64,'+btoa(t));a.loop=true;a.play().catch(()=>{});A.el=a}catch(e){}}
function wakeAudio(){if(!A.ctx){audioInit()}if(A.ctx&&A.ctx.state!=='running'){A.ctx.resume().catch(()=>{})}if(A.el&&A.el.paused)A.el.play().catch(()=>{})}
['touchend','pointerup','click'].forEach(ev=>document.addEventListener(ev,wakeAudio,true));
function applyAudio(){if(!A.ctx)return;A.sfx.gain.value=S.set.sfx?S.set.sv:0;A.mus.gain.value=S.set.music?S.set.mv*.5:0}
document.addEventListener('visibilitychange',()=>{if(!A.ctx)return;document.hidden?A.ctx.suspend():A.ctx.resume()});
function tone(f,d,type='sine',v=.2,t0=0,glide=null,dest){
 if(!A.ctx)return;const c=A.ctx,t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(dest||A.sfx);o.start(t);o.stop(t+d+.05)}
function noiseBurst(d,fc,v=.3,t0=0,type='lowpass',dest){
 if(!A.ctx)return;const c=A.ctx,t=c.currentTime+t0,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=A.noise;f.type=type;f.frequency.setValueAtTime(fc,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,fc/6),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t);s.stop(t+d+.05)}
function meow(p=1,len=.45){
 if(!A.ctx)return;const c=A.ctx,t=c.currentTime,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),f1=c.createBiquadFilter(),f2=c.createBiquadFilter();
 o.type='sawtooth';o2.type='triangle';const b=560*p;
 for(const x of[o,o2]){x.frequency.setValueAtTime(b*.8,t);x.frequency.linearRampToValueAtTime(b*1.25,t+len*.35);x.frequency.exponentialRampToValueAtTime(b*.7,t+len)}
 f1.type='bandpass';f1.Q.value=5;f1.frequency.setValueAtTime(700,t);f1.frequency.linearRampToValueAtTime(1500,t+len*.4);f1.frequency.linearRampToValueAtTime(900,t+len);
 f2.type='lowpass';f2.frequency.value=3200;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.06);g.gain.linearRampToValueAtTime(.25,t+len*.6);g.gain.exponentialRampToValueAtTime(.001,t+len);
 o.connect(f1);o2.connect(f1);f1.connect(f2);f2.connect(g);g.connect(A.sfx);o.start(t);o2.start(t);o.stop(t+len+.05);o2.stop(t+len+.05)}
function purr(d=1.4){
 if(!A.ctx)return;const c=A.ctx,t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
 s.buffer=A.noise;s.loop=true;f.type='bandpass';f.frequency.value=140;f.Q.value=1.2;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.2);g.gain.linearRampToValueAtTime(0,t+d);
 l.frequency.value=24;l.type='sine';lg.gain.value=.5;l.connect(lg);lg.connect(g.gain);
 s.connect(f);f.connect(g);g.connect(A.sfx);s.start(t);l.start(t);s.stop(t+d);l.stop(t+d)}
const PENT=[0,2,4,7,9,12,14,16,19,21,24];
const nf=(n,base=392)=>base*Math.pow(2,n/12);
const SFX={
 swap(){tone(520,.08,'triangle',.12);tone(700,.08,'triangle',.1,.05)},
 bad(){tone(180,.18,'sawtooth',.12,0,120)},
 match(c){const n=PENT[Math.min(c,PENT.length-1)];tone(nf(n),.25,'triangle',.22);tone(nf(n+7),.3,'sine',.12,.06)},
 pop(){tone(900+rnd(300),.06,'sine',.08)},
 laser(){tone(1800,.4,'square',.12,0,200);noiseBurst(.3,6000,.15,0,'highpass')},
 bomb(){noiseBurst(.55,1800,.5);tone(110,.5,'sine',.5,0,40)},
 zoom(){tone(300,.5,'sawtooth',.1,0,1400);tone(305,.5,'sawtooth',.08,.05,1300);meow(1.5,.25)},
 rainbow(){[0,4,7,12,16,19,24].forEach((n,i)=>tone(nf(n,523),.3,'triangle',.18,i*.06))},
 mega(){meow(.6,.8);[0,7,12,16].forEach((n,i)=>tone(nf(n,220),.9,'sawtooth',.14,i*.05));noiseBurst(.8,2500,.45)},
 win(){[0,4,7,12,7,12,16].forEach((n,i)=>tone(nf(n,523),.35,'triangle',.22,i*.12));setTimeout(()=>purr(1.5),500)},
 lose(){[7,5,3,0].forEach((n,i)=>tone(nf(n,330),.4,'triangle',.2,i*.2))},
 click(){tone(660,.07,'triangle',.15)},
 coin(){tone(1320,.08,'square',.08);tone(1760,.16,'square',.08,.07)},
 star(i){tone(nf(i*4,523),.4,'triangle',.25);meow(1.1+i*.1,.3)},
 drop(){tone(300,.08,'sine',.12,0,150)}
};
function sfx(n,...a){if(!A.ctx||!S.set.sfx)return;try{SFX[n](...a)}catch(e){}}

  else if(name==='center'&&r>=3&&r<=4&&c>=2&&c<=5)add(r,c);
  else if(name==='checker'&&r>=2&&r<=5&&(r+c)%2===0)add(r,c);

/* ---------- engine: matching ---------- */
function findGroups(){
 const runs=[];const B=G.board;
 for(let r=0;r<N;r++){let c=0;while(c<N){const p=B[r][c];if(!matchable(p)){c++;continue}let e=c;while(e+1<N&&matchable(B[r][e+1])&&B[r][e+1].t===p.t)e++;
  if(e-c>=2)runs.push({d:'h',t:p.t,cells:Array.from({length:e-c+1},(_,i)=>key(r,c+i))});c=e+1}}
 for(let c=0;c<N;c++){let r=0;while(r<N){const p=B[r][c];if(!matchable(p)){r++;continue}let e=r;while(e+1<N&&matchable(B[e+1][c])&&B[e+1][c].t===p.t)e++;
  if(e-r>=2)runs.push({d:'v',t:p.t,cells:Array.from({length:e-r+1},(_,i)=>key(r+i,c))});r=e+1}}
 const groups=[];
 for(const ru of runs){const hit=groups.filter(g=>g.t===ru.t&&ru.cells.some(k=>g.cells.has(k)));
  let g=hit[0];if(!g){g={t:ru.t,cells:new Set(),runs:[]};groups.push(g)}
  for(let i=1;i<hit.length;i++){hit[i].cells.forEach(k=>g.cells.add(k));g.runs.push(...hit[i].runs);groups.splice(groups.indexOf(hit[i]),1)}

function specialFor(g,swapKeys){

 if(longest.cells.length>=5)sp='rainbow';else if(hasH&&hasV)sp='bomb';else if(longest.cells.length===4)sp=longest.d==='h'?'laser':'laserv';

function findMove(){
 const B=G.board;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(!inb(r2,c2))continue;
  const a=B[r][c],b=B[r2][c2];if(!a||!b||a.kind==='box'||b.kind==='box')continue;
  if(isCat(a)&&isCat(b)&&(a.sp||b.sp))return[r,c,r2,c2];

  B[r][c]=b;B[r2][c2]=a;const ok=findGroups().length>0;B[r][c]=a;B[r2][c2]=b;if(ok)return[r,c,r2,c2]}

async function doClear(set,creates,cascade,act){

function spawnFn(){return function(){

  if(o.n-o.have-onB-(G.pending[o.k]||0)>0&&Math.random()<.3){G.pending[o.k]=(G.pending[o.k]||0)+1;return{id:_id++,kind:'item',t:o.k}}}

function fall(){

 for(let c=0;c<N;c++){let w=N-1;

async function resolve(swapKeys,first){

  if(!set.size)break;cascade++;
  S.stats.matches=(S.stats.matches||0)+groups.length;
  await doClear(set,creates,cascade,first?first.act:null);first=null;swapKeys=[];
  await settle();
  if(cascade>=3&&!G.zoomed){G.zoomed=true;const cands=allKeys(p=>plain(p));if(cands.length){const k=pick(cands),p=G.board[kr(k)][kc(k)];p.sp='zoom';refresh(p);burst(p.r,p.c,'#fff',14,1.4);banner('Zoomies!',800,'#2f7fcf');sfx('zoom');await sleep(250)}}}

  cells.forEach((k,i)=>{G.board[kr(k)][kc(k)]=ps[i]});tries++;
